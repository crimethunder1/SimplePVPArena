name: SimplePVPArena
version: '${project.version}'
main: de.simplepvparena.SimplePVPArenaPlugin
api-version: '26.2'
description: Tournament plugin running a team versus team single elimination bracket with teams of 1 to 8 players, the team size is match.team-size in config.yml
authors:
  - crimethunder
softdepend:
  - ViaVersion
  - ViaBackwards
  - ItemsAdder
commands:
  tournament:
    description: Opens the tournament administration menu, /tournament bracket shows the bracket, /tournament join and /tournament leave register for the next event and take the registration back, /tournament team opens the team choice again, /tournament vote opens the vote of the larger team on who fights again, /tournament spectate returns to the tribune, /tournament playagain registers again after an auto match while its question is open
    usage: '/<command> [bracket|spectate|join|leave|team|vote|playagain]'
    aliases:
      - turnier
permissions:
  tournament.admin:
    description: Allows opening the tournament menu that manages teams and the team size, the registrations, the kits, the arena, border blocks, matches and the tournament
    default: op
  tournament.spectate:
    description: Allows returning to the tribune of the arena
    default: true
  tournament.view:
    description: Allows opening the bracket menu with /tournament bracket, it only shows the rounds and matches and changes nothing, and registering for the next event with /tournament join and /tournament leave and choosing a team with /tournament team, and playing again after an auto match with /tournament playagain, a player with tournament.admin may always do the same
    default: true

main-menu:
  title: 'Turnierverwaltung'
  registered-teams:
    one: 'Registrierte Teams: {count}'
    other: 'Registrierte Teams: {count}'
  tile:
    info:
      title: 'Turnier'
      arena-ready: 'Arena: bereit'
      arena-incomplete: 'Arena: unvollständig'
    arena:
      title: 'Arena'
      lore: 'Kampffläche, Spawns, Reinigung und Zurücksetzen'
      ready: 'Arena bereit'
      incomplete: 'Arena unvollständig'
    teams:
      title: 'Teams'
      lore: 'Zeigt alle Teams, fügt eines hinzu und entfernt eines'
    match:
      title: 'Match und Turnier'
      lore: 'Starten, pausieren, abbrechen und ein Ergebnis erzwingen'
    border-selector:
      title: 'Wandblöcke per Klick markieren'
      lore:
        - 'Macht jeden deiner Rechtsklicks zu einer Wandmarkierung'
        - 'Ein Klick markiert einen Block, ein Klick auf einen'
        - 'markierten Block nimmt die Markierung wieder weg'
        - 'Kein Wand-Item nötig: Treppen, Zäune und jeder'
        - 'andere Block, der schon dort steht, lässt sich markieren'
        - 'Truhen, Türen und alles andere bleiben zu, solange er an ist'
        - 'Das Menü schließt sich, damit du die Blöcke anklicken kannst'
      mode-on: 'Der Modus ist an, diese Kachel schaltet ihn aus'
      mode-off: 'Der Modus ist aus, diese Kachel schaltet ihn an'
    status:
      title: 'Turnierstatus'
      lore: 'Schreibt den Stand, die Turnierrunden und das laufende Match in den Chat'
    bracket:
      title: 'Turnierbaum'
      lore:
        - 'Schreibt jede Turnierrunde und jedes Match in den Chat'
        - 'Der Chat zeigt einen Turnierbaum besser als ein Raster'
        - 'Das Menü schließt sich, damit du ihn lesen kannst'
    dry-run:
      title: 'Probelauf des Turnierablaufs'
      lore:
        - 'Geht den ganzen Ablauf einmal durch, ohne Event'
        - 'Registriert zwei Testteams, baut ihren Turnierbaum,'
        - 'entscheidet ein simuliertes Match und entfernt sie wieder'
        - 'Prüft die Arena und ihre Spawns, das Kit, den'
        - 'Countdown des Starttors und ob die'
        - 'Reinigung nach einem Match starten würde'
        - 'Nichts wird gestartet, geschrieben oder gereinigt:'
        - 'kein Block, keine Datei und kein Kämpfer wird berührt'
        - 'Für das Kit und das echte Ankommen nach dem'
        - 'Teleport bleibt ein echter Testspieler nötig'
        - 'Gesperrt, solange ein Turnier oder ein Match läuft'
    reload:
      title: 'config.yml neu laden'
      lore:
        - 'Liest config.yml erneut und wendet sie sofort an'
        - 'Rundenzeitlimit, Blockmengen der Reinigung, Zellgrenze,'
        - 'Schutzzone und Wandpartikel'
        - 'Die Arena, die Teams und ein laufendes Match bleiben unberührt'
      match-running:
        - 'Ein Match läuft: das neue Rundenzeitlimit'
        - 'gilt ab der nächsten Runde'
    kits:
      title: 'Kits'
      count:
        one: 'Kits: {count}'
        other: 'Kits: {count}'
      default-kit: 'Standard-Kit: {kit}'
      no-default-kit: 'Standard-Kit: keins'
      lore:
        - 'Die Items, die jeder Kämpfer zum Start einer Runde bekommt'
        - 'Kits anlegen, ersetzen und löschen'
    kit-choice:
      title: 'Kit für das nächste Match wählen'
      match: 'Match {match}: {firstTeam} gegen {secondTeam}'
      lore: 'Das Fenster schließt sich, wenn die Zeit um ist oder ein Kit gewählt wurde'
    close:
      title: 'Schließen'
      lore: 'Schließt das Menü'
  border-selector:
    switched-on:
      - 'Der Wandauswahlmodus ist an'
      - 'Klicke mit rechts auf einen beliebigen Block der Welt, um ihn als Wandblock zu markieren, ein Rechtsklick auf einen markierten Block nimmt die Markierung wieder weg'
      - 'Kein Wand-Item nötig: Treppen, Zäune und alles andere, was schon dort steht, kann Teil der Wand werden'
      - 'Jeder andere Rechtsklick ist gesperrt, solange der Modus an ist, auch bei Truhen und Türen'
      - 'Öffne das Turniermenü und klicke die Kachel erneut an, um ihn auszuschalten'
    switched-off:
      - 'Der Wandauswahlmodus ist aus'
      - 'Rechtsklicks funktionieren wieder wie immer, jede gesetzte Markierung bleibt'
  bracket:
    heading: 'Turnierbaum'
  reload:
    running-match-delay:
      - 'Ein Match läuft, die neuen Einstellungen gelten ab der nächsten Runde'
      - 'Die laufende Runde behält ihre Rundenzeit und ihre Kämpfer behalten ihr Kit'

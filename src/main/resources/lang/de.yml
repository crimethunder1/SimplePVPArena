    pause:
      title: 'Turnier pausieren'
      lore: 'Bis zur Fortsetzung startet kein weiteres Match'
    continue:
      title: 'Turnier fortsetzen'
      lore: 'Die Rundenzeit läuft mit ihrer verbleibenden Zeit weiter'
    cancel:

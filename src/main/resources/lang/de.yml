# German texts of SimplePVPArena. Words in braces such as {team} are filled in by the plugin.
# A key missing here falls back to the shipped text. The plugin never changes this file.
message:
  prefix: 'Turnier'
common:
  list:
    and: '{items} und {last}'
    more: '{items} und {count} weitere'
  language-file-unreadable: 'Die Sprachdatei {file} konnte nicht gelesen werden ({reason}), bis zur Korrektur gelten die mitgelieferten Texte'
  no-tournament-in-progress: 'Es läuft kein Turnier'
  tournament-already-in-progress: 'Es läuft bereits ein Turnier'
  asks-for-confirmation: 'Fragt vorher nach einer Bestätigung'
  menu-closes-to-type: 'Das Menü schließt sich, damit du tippen kannst'
  menu-closes-to-read: 'Das Menü schließt sich, damit du die Antwort lesen kannst'
  round-timer-keeps-time: 'Die Rundenzeit behält ihre verbleibende Zeit'
  command-not-allowed: 'Du darfst diesen Befehl nicht benutzen'
menu:
  back:
    name: 'Zurück'
    main-menu: 'Zurück zum Hauptmenü'
    match-menu: 'Zurück zum Match-Menü'
    waiting-matches: 'Zurück zu den wartenden Matches'
    team-list: 'Zurück zur Team-Liste'
    team-options: 'Zurück zu den Optionen von Team {team}'
    kit-list: 'Zurück zur Kit-Liste'
  page:
    previous: 'Vorherige Seite'

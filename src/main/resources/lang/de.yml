input:
  cancel-word: 'abbrechen'
  prompt-footer: 'Gib {word} ein, um abzubrechen, die Anfrage läuft in {seconds} Sekunden ab'
  cancelled: 'Die Eingabe für {description} wurde abgebrochen, nichts wurde geändert'
  expired:
    - 'Die Eingabe für {description} ist abgelaufen, nichts wurde geändert'
    - 'Öffne /tournament erneut, um neu zu beginnen'
  nothing-typed: 'Es wurde nichts eingegeben, erwartet wird {usage}'
  expected-values: 'Erwartet werden {count} durch Leerzeichen getrennte Werte ({usage}), eingegeben wurden {givenCount}: {values}'
  expected-value-range: 'Erwartet werden {minimum} bis {maximum} durch Leerzeichen getrennte Werte ({usage}), eingegeben wurden {givenCount}: {values}'

  cancelled: 'The kit choice was cancelled'
kit-menu:
  title: 'Kits (page {page})'
  tile:
    info:
      title: 'Kits'
      kit-count:
        one: 'Kits: {count}'
        other: 'Kits: {count}'
      default-kit: 'Default kit: {kit}'
      no-default-kit: 'Default kit: none'
      hint: 'A click on a kit opens its options'
    kit:
      default-kit: 'Default kit'
      lore: 'Click for the options of this kit'
    create:
      title: 'Create a kit from your inventory'
      asks-for-name: 'Asks for the name of the new kit in the chat'
      first-kit: 'The first kit becomes the default kit'

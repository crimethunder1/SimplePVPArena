arena-menu:
  title: 'Arena'
  tile:
    info:
      title: 'Arena'
    calculate:
      title: 'Calculate the fight area'
      lore:
        - 'Runs the calculation for the position you stand on'
        - 'Stand inside the closed border wall before you click'
        - 'The menu closes so you can see the recognized wall'
    diagnose:
      title: 'Diagnose with a higher cell limit'
      limit:
        one: 'One calculation with a limit you type, up to {count} cell'
        other: 'One calculation with a limit you type, up to {count} cells'
      lore:
        - 'Shows how far a fill through a gap really gets'
        - 'config.yml stays untouched'
    first-team-spawn:
      title: 'Set the first team spawn'
    second-team-spawn:
      title: 'Set the second team spawn'
    tribune-spawn:
      title: 'Set the tribune spawn'
    spawn:
      lore:
        - 'Sets it to the position you stand on'
        - 'Stand {placement}'
        - 'A position on the wrong side of the fight area'
        - 'is refused once the area is calculated'
    clean:
      title: 'Clean the arena'
      without-fight-area: 'No fight area is calculated, there is nothing to clean'
    reset:
      title: 'Reset the arena'
      lore:
        - 'Drops the fight area and all three spawns'
        - 'The blocks and the border blocks stay untouched'
    height-marker:
      title: 'Mark the height of the fight area'
      lore:
        - 'Hands you the item that marks the lowest and the'
        - 'highest point of the fight area'
        - 'Place a block with it, only its height is kept'
        - 'and the block disappears again'
        - 'The next calculation takes them over as the floor'
        - 'and the ceiling of the fight area, also below the'
        - 'border wall, and uses both marks up'
    start-gate:
      title: 'Give start gate blocks'
      lore:
        - 'Asks for a material and an amount in the chat and'
        - 'hands you that many start gate blocks'
        - 'Build a box around each team spawn and close it'
        - 'with them: every placed one is part of the gate,'
        - 'breaking one takes it out again'
        - 'Every round start puts the whole gate back and takes'
        - 'it apart again from the top, with a countdown'
        - 'A gate nobody placed is skipped, the round still starts'
  cleaning:
    affected-blocks:
      one: '{count} block is affected'
      other: '{count} blocks are affected'
  clean-confirmation:
    - 'The change cannot be undone'
    - 'The border wall around it stays untouched'
  reset-confirmation:
    - 'The fight area and all three spawns are dropped'
    - 'The blocks of the arena and the border blocks stay untouched'
    - 'No tournament can be started until it is calculated again'
  height-marker:
    inventory-full: 'Your inventory is full, the height marker could not be handed out'
    handed-out:
      - 'You received the height marker of the fight area'
      - 'Place a block with it at the lowest point of the area, the item switches to the highest one by itself'
      - 'The placed block disappears again, only its height is kept'
  start-gate-input:
    description: 'the start gate blocks'
    prompt:
      - 'Type: {usage} in chat'
      - 'Example: barrier 32'
      - 'The amount has to be between {minimum} and {maximum}'
  start-gate:
    inventory-full: 'Your inventory is full, not every gate block could be handed out'
    handed-out:
      one:
        - 'You received {count} {material} start gate block'
        - 'Build the box around a team spawn out of whatever your map is made of and close it with this block'
        - 'It is part of the gate right away once you place it, breaking it takes it out again'
        - 'Every round start puts the whole gate back and takes it apart again from the top'
      other:
        - 'You received {count} {material} start gate blocks'
        - 'Build the box around a team spawn out of whatever your map is made of and close it with these blocks'
        - 'Every one of them you place is part of the gate right away, breaking one takes it out again'
        - 'Every round start puts the whole gate back and takes it apart again from the top'
  diagnosis-input:
    description: 'the diagnosis cell limit'
    prompt:
      - 'Type: {usage} in chat'
      - 'A number between {minimum} and {maximum}'
      - 'Stand inside the border wall, the calculation runs from where you stand'
      - 'config.yml is not changed by it'

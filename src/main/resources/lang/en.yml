        one: 'Players: {count} of {teamSize}'
        other: 'Players: {count} of {teamSize}'
      hint: 'A click on a player removes the player'
      not-registered: 'This team is not registered any more'
    member:
      lore: 'Click to remove the player from the team'
kit:

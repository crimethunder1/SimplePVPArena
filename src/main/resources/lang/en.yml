  round-of-rounds: 'Round {round} of {roundCount}'
  tile:
    info:
      title: 'Bracket'
      state: 'Tournament state: {state}'
      champion: 'Champion: {team}'
      matches-cut-off: 'Shows the first {shown} of {total} matches of this round'
    match:
      teams: '{firstTeam} against {secondTeam}'
      open-team: 'open'
      waiting-for-teams: 'Waiting for its teams'
      ready: 'Ready to be played'
      running: 'Running now'
      won-by: 'Won by {team}'
      bye: '{team} advances without an opponent'
    previous-round:
      title: 'Previous round'
    next-round:
      title: 'Next round'
confirmation:
  tile:
    confirm:
      title: 'Yes'
      lore: 'Carries the action out'
    refuse:
      title: 'No'
      lore: 'Changes nothing and returns'
  question:
    clean-arena: 'Clean the arena?'
    reset-arena: 'Reset the arena?'
    replace-kit: 'Replace the kit with your inventory?'
    delete-kit: 'Delete the kit?'
    remove-team: 'Remove the team?'
    cancel-tournament: 'Cancel the tournament?'
    restart-match: 'Restart the match?'
    form-random-teams: 'Form random teams?'
    clear-registrations: 'Clear the registrations?'
    revoke-result: 'Take back the result of {match}?'

  no-default-kit-named: 'No default kit is named although there are kits'
  default-kit-unknown: 'The default kit {kit} is not one of the kits'
  unknown-kit: 'Unknown kit {kit}'
  write-failed: 'The kits could not be written into {file} ({reason}), the change counts until the server stops and is written again with the next change of a kit'

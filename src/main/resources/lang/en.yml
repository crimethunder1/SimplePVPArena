# English texts of SimplePVPArena. Words in braces such as {team} are filled in by the plugin.
# A key missing here falls back to the shipped text. The plugin never changes this file.
message:
  prefix: 'Tournament'
common:
  list:
    and: '{items} and {last}'
    more: '{items} and {count} more'
  language-file-unreadable: 'The language file {file} could not be read ({reason}), the built-in texts are used until it is fixed'
  no-tournament-in-progress: 'No tournament is in progress'
  tournament-already-in-progress: 'A tournament is already in progress'
  asks-for-confirmation: 'Asks for a confirmation first'
  menu-closes-to-type: 'The menu closes so you can type'
  menu-closes-to-read: 'The menu closes so you can read the answer'
  round-timer-keeps-time: 'The round timer keeps its remaining time'
  command-not-allowed: 'You are not allowed to use this command'
menu:
  back:
    name: 'Back'
    main-menu: 'Returns to the main menu'
    match-menu: 'Returns to the match menu'
    waiting-matches: 'Returns to the waiting matches'
    team-list: 'Returns to the team list'
    team-options: 'Returns to the options of team {team}'
    kit-list: 'Returns to the kit list'
  page:
    previous: 'Previous page'
    next: 'Next page'
    target: 'Page {page} of {pageCount}'
  not-allowed: 'You are not allowed to use the tournament menu'
  unknown-player:
    - 'Unknown player {player}'
    - 'The player has to be online or known to the server'
input:
  cancel-word: 'cancel'
  prompt-footer: 'Type {word} to abort, the request expires in {seconds} seconds'
  cancelled: 'The input for {description} was cancelled, nothing was changed'
  expired:
    - 'The input for {description} expired, nothing was changed'
    - 'Open /tournament again to start over'
  nothing-typed: 'Nothing was typed, expected {usage}'
  expected-values: 'Expected {count} values separated by spaces ({usage}), but got {givenCount}: {values}'
  expected-value-range: 'Expected {minimum} to {maximum} values separated by spaces ({usage}), but got {givenCount}: {values}'
  unknown-material: 'Unknown material {material}'
  not-a-block: '{material} cannot be placed as a block'
  amount-not-a-number: 'The amount {amount} is not a number'
  amount-out-of-range: 'The amount has to be between {minimum} and {maximum}'
main-menu:
  title: 'Tournament administration'
  registered-teams:
    one: 'Registered teams: {count}'
    other: 'Registered teams: {count}'
  tile:
    info:
      title: 'Tournament'
      arena-ready: 'Arena: ready'
      arena-incomplete: 'Arena: incomplete'
    arena:
      title: 'Arena'
      lore: 'Fight area, spawns, cleaning and reset'
      ready: 'Arena ready'
      incomplete: 'Arena incomplete'
    teams:
      title: 'Teams'
      lore: 'Shows every team, adds one and removes one'
    match:
      title: 'Match and tournament'
      lore: 'Start, pause, cancel and force a result'
    border-selector:
      title: 'Mark border blocks by clicking them'
      lore:
        - 'Turns every right click of yours into a border mark'
        - 'A click marks a block, a click on a marked block'
        - 'takes the mark away again'
        - 'No border item is needed: stairs, fences and every'
        - 'other block that already stands there can be marked'
        - 'Chests, doors and everything else stay shut while it is on'
        - 'The menu closes so you can click the blocks'
      mode-on: 'The mode is on, this tile switches it off'
      mode-off: 'The mode is off, this tile switches it on'
    status:
      title: 'Tournament status'
      lore: 'Writes the state, the rounds and the running match into the chat'
    bracket:
      title: 'Bracket'
      lore:
        - 'Writes every round and every match into the chat'
        - 'A bracket is a tree, the chat shows it better than a grid'
        - 'The menu closes so you can read it'
    dry-run:
      title: 'Dry run of the pipeline'
      lore:
        - 'Walks the whole pipeline once, without an event'
        - 'Registers two test teams, builds their bracket,'
        - 'decides a simulated match and removes them again'
        - 'Checks the arena and its spawns, the kit, the'
        - 'countdown of the start gate and whether the'
        - 'cleaning after a match would start'
        - 'Nothing is started, written or cleaned:'
        - 'no block, no file and no fighter is touched'
        - 'A real test player stays necessary for the kit'
        - 'and the teleport really arriving'
        - 'Refused while a tournament or a match runs'
    reload:
      title: 'Reload config.yml'
      lore:
        - 'Reads config.yml again and applies it live'
        - 'Round timeout, cleaning batch sizes, cell limit,'
        - 'safety zone and border particles'
        - 'The arena, the teams and a running match stay untouched'
      match-running:
        - 'A match is running: the new round timeout'
        - 'arrives with the next round'
    kits:
      title: 'Kits'
      count:
        one: 'Kits: {count}'
        other: 'Kits: {count}'
      default-kit: 'Default kit: {kit}'
      no-default-kit: 'Default kit: none'
      lore:
        - 'The items every fighter is given when a round starts'
        - 'Create, replace and delete kits'
    kit-choice:
      title: 'Choose the kit for the next match'
      match: 'Match {match}: {firstTeam} against {secondTeam}'
      lore: 'The popup closes when the time is over or a kit is chosen'
    close:
      title: 'Close'
      lore: 'Closes the menu'
  border-selector:
    switched-on:
      - 'Border selector mode is on'
      - 'Right click any block in the world to mark it as a border block, right click a marked one to take its mark away again'
      - 'No border item is needed: stairs, fences and everything else that already stands there can become part of the wall'
      - 'Every other right click is blocked while the mode is on, chests and doors included'
      - 'Open the tournament menu and click the tile again to switch it off'
    switched-off:
      - 'Border selector mode is off'
      - 'Right clicking works the way it always did again, every mark you set stays'
  bracket:
    heading: 'Bracket'
  reload:
    running-match-delay:
      - 'A match is running, the new settings arrive with the next round'
      - 'The running round keeps its timer and its fighters keep the kit they were given'
match-menu:
  title: 'Match and tournament'
  running-match: 'Running match: {match}'
  no-running-match: 'Running match: none'
  no-match-running: 'No match is running'
  cancel-confirmation:
    - 'The running tournament is cancelled'
    - 'The running match is stopped and its bracket is dropped'
  tile:
    info:
      title: 'Tournament'
      round-timer-paused: 'Round timer: paused'
      round-timer-running: 'Round timer: running'
    start:
      title: 'Start the tournament'
      lore: 'Needs an even number of teams'
    force-start:
      title: 'Force start'
      lore: 'Starts the tournament with an uneven number of teams'
    pause:
      title: 'Pause the tournament'
      lore: 'No further match is started until it continues'
    continue:
      title: 'Continue the tournament'
      lore: 'The round timer continues with its remaining time'
    cancel:
      title: 'Cancel the tournament'
      lore: 'Stops the running match and the bracket'
    decide-waiting-match:
      title: 'Decide a waiting match'
      lore: 'Decides a match that is not running for one of its two teams'
    force-result:
      title: 'Force a result'
      lore: 'Decides the running match for one of its two teams'
    final:
      title: 'Start the final'
      lore:
        - 'Both finalists are known'
        - 'Starts the final on the arena'
      pending: 'The final is not ready, its stage is PENDING'
      ready: 'The final is not ready, its stage is READY'
      running: 'The final is running'
      over: 'The final is over'
force-result-menu:
  title: 'Result of {match}'
  match-not-running: 'Match {match} is not running any more'
  tile:
    info:
      title: 'Force a result'
      match: 'Match {match}'
      round: 'Round {round}'
      hint: 'A click decides the match for that team'
    team:
      lore: 'Decides the match for this team'
waiting-matches-menu:
  title: 'Waiting matches (page {page})'
  tile:
    info:
      title: 'Waiting matches'
      no-match-waiting: 'No match is waiting'
      count:
        one: 'Waiting matches: {count}'
        other: 'Waiting matches: {count}'
      hint: 'A click on a match decides it for one of its teams'
    match:
      teams: '{firstTeam} vs {secondTeam}'
      round: 'Round {round}'
      team-not-registered: '{team} is no longer registered'
waiting-match-result-menu:
  title: 'Result of {match}'
  match-not-waiting: 'Match {match} is not waiting any more'
  tile:
    info:
      title: 'Decide a waiting match'
      match: 'Match {match} ({firstTeam} vs {secondTeam})'
      hint: 'A click decides the match for that team'
    team:
      not-registered: 'No longer registered'
      lore: 'Decides the match for this team'
confirmation:
  tile:
    confirm:
      title: 'Yes'
      lore: 'Carries the action out'
    refuse:
      title: 'No'
      lore: 'Changes nothing and returns'
  question:
    clean-arena: 'Clean the arena?'
    reset-arena: 'Reset the arena?'
    replace-kit: 'Replace the kit with your inventory?'
    delete-kit: 'Delete the kit?'
    remove-team: 'Remove the team?'
    cancel-tournament: 'Cancel the tournament?'
team:
  name-rule: '1 to {maximumLength} letters, digits, hyphens or underscores'
  name-missing: 'A team needs a name, a team name has {rule}'
  name-not-allowed: 'The team name {team} is not allowed, a team name has {rule}'
  member-count-out-of-range: 'a team has {minimum} to {maximum} players'
  same-player-twice: 'a team cannot hold the same player twice'
  already-exists: 'a team named {team} already exists'
  team-full:
    one: 'team {team} already has {count} player, a team has at most {count} player'
    other: 'team {team} already has {count} players, a team has at most {count} players'
  player-not-in-team: 'the player {uniqueId} is not in team {team}'
  last-member:
    one: 'a team keeps at least {count} player, remove the team instead'
    other: 'a team keeps at least {count} players, remove the team instead'
  not-registered: 'no team named {team} is registered'
  player-already-in-team: '{player} is already registered in team {team}'
  creation:
    usage: '<teamName> <player> [<player> ...]'
    player-named-twice: 'A team needs {minimum} to {maximum} different players, {player} was named twice'
  size:
    out-of-range: 'The team size must lie between {minimum} and {maximum} players'
    tournament-in-progress: 'The team size cannot be changed while a tournament is in progress'
    match-up: '{teamSize} ({teamSize} versus {teamSize})'
    larger-teams:
      than-one-player:
        one: '{count} team has more than {teamSize} player: {teams}'
        other: '{count} teams have more than {teamSize} player: {teams}'
      than-several-players:
        one: '{count} team has more than {teamSize} players: {teams}'
        other: '{count} teams have more than {teamSize} players: {teams}'
    smaller-teams:
      than-one-player:
        one: '{count} team has fewer than {teamSize} player: {teams}'
        other: '{count} teams have fewer than {teamSize} player: {teams}'
      than-several-players:
        one: '{count} team has fewer than {teamSize} players: {teams}'
        other: '{count} teams have fewer than {teamSize} players: {teams}'
    remove-larger-teams-first:
      one: '{largerTeams}. Remove it first'
      other: '{largerTeams}. Remove them first'
    team-with-members: '{team} ({members})'
    team-with-member-count: '{team} ({memberCount})'
teams-menu:
  title: 'Teams (page {page})'
  smallest-team-size: 'The smallest team size is {minimum}'
  largest-team-size: 'The largest team size is {maximum}'
  team-size-changed: 'Team size is now {matchUp}'
  team-size-not-written: 'Team size is now {matchUp}, but config.yml could not be written: {reason}'
  team-registered: 'Team {team} registered with {members}'
  registration-failed:
    - 'Team {team} could not be registered'
    - '{reason}'
  tile:
    team:
      members: 'Members: {members}'
      lore: 'Click for the options of this team'
    info:
      title: 'Teams'
      registered-teams:
        one: 'Registered teams: {count}'
        other: 'Registered teams: {count}'
      team-size: 'Team size: {matchUp}'
      hint: 'A click on a team opens its options'
    smaller:
      title: 'Smaller teams'
      lore:
        one: 'Click to make teams of {count} player'
        other: 'Click to make teams of {count} players'
    larger:
      title: 'Larger teams'
      lore:
        one: 'Click to make teams of {count} player'
        other: 'Click to make teams of {count} players'
    add:
      title: 'Add a team'
      lore:
        - 'Asks for {usage} in the chat'
        - 'Player names cannot be typed into an inventory'
  add-input:
    description: 'the team to add'
    type: 'Type: {usage} in chat'
    exact-size:
      one: 'A team has {count} player, a team name has {rule}'
      other: 'A team has {count} players, a team name has {rule}'
    size-range: 'A team has {minimum} to {maximum} players, a team name has {rule}'
    examples:
      - 'Example: Alpha Steve Alex'
      - 'Example: Bravo Notch Jeb_ Dinnerbone'
    players-known: 'Every player has to be online or known to the server'
team-actions-menu:
  title: 'Team {team}'
  not-registered: 'This team is not registered any more'
  team-full:
    one: 'Team {team} already has {count} player, the team size is {teamSize}'
    other: 'Team {team} already has {count} players, the team size is {teamSize}'
  remove-confirmation:
    - 'Team {team} is removed from the registry'
    - 'A team that plays a match cannot be removed'
  team-renamed: 'Team {formerName} is now called {newName}'
  rename-failed:
    - 'Team {team} could not be renamed'
    - '{reason}'
  player-joined: '{player} joined team {team}'
  join-failed:
    - '{player} could not join team {team}'
    - '{reason}'
  unknown-team: 'Unknown team {team}'
  team-removed: 'Team {team} removed'
  tile:
    info:
      members: 'Members: {members}'
      player-count:
        one: 'Players: {count} of {teamSize}'
        other: 'Players: {count} of {teamSize}'
      not-registered: 'This team is not registered any more'
    rename:
      title: 'Rename the team'
      lore:
        - 'Asks for the new name in the chat'
        - 'The team keeps its place in the team list'
    add-player:
      title: 'Add a player'
      lore: 'Asks for the name of the player in the chat'
      team-full:
        one: 'The team already has {count} player, the team size is {teamSize}'
        other: 'The team already has {count} players, the team size is {teamSize}'
    remove-player:
      title: 'Remove a player'
      lore:
        - 'Shows the players of {team}'
        - 'A click on a player removes the player'
    remove:
      title: 'Remove the team'
      lore: 'Removes {team} from the registry'
  rename-input:
    description: 'the new name of team {team}'
    prompt:
      - 'Type: <newName> in chat'
      - 'A team name has {rule}'
      - 'Example: Phoenix'
      - 'The team keeps its players and its place in the team list'
  add-player-input:
    description: 'the player to add to team {team}'
    type: 'Type: <player> in chat'
    player-count:
      one: 'Team {team} has {memberCount} of {count} player'
      other: 'Team {team} has {memberCount} of {count} players'
    hints:
      - 'Example: Steve'
      - 'Every player has to be online or known to the server'
team-members-menu:
  title: 'Players of {team}'
  player-left: '{player} left team {team}'
  leave-failed:
    - '{player} could not leave team {team}'
    - '{reason}'
  tile:
    info:
      player-count:
        one: 'Players: {count} of {teamSize}'
        other: 'Players: {count} of {teamSize}'
      hint: 'A click on a player removes the player'
      not-registered: 'This team is not registered any more'
    member:
      lore: 'Click to remove the player from the team'
kit:
  name-rule: '1 to {maximumLength} letters, digits, hyphens or underscores'
  name-missing: 'A kit needs a name, a kit name has {rule}'
  name-not-allowed: 'The kit name {kit} is not allowed, a kit name has {rule}'
  already-exists: 'A kit named {kit} exists already'
  already-default-kit: 'Kit {kit} is the default kit already'
  last-kit: 'Kit {kit} is the last kit and cannot be deleted'
  default-kit-not-deletable: 'Kit {kit} is the default kit and cannot be deleted'
  name-used-twice: 'The kit name {kit} is used twice'
  no-default-kit-named: 'No default kit is named although there are kits'
  default-kit-unknown: 'The default kit {kit} is not one of the kits'
  unknown-kit: 'Unknown kit {kit}'
  write-failed: 'The kits could not be written into {file} ({reason}), the change counts until the server stops and is written again with the next change of a kit'
  definition:
    empty: 'The kit is empty, no fighter is given anything'
    worn-items:
      one: 'Worn items: {count} of {slotCount}'
      other: 'Worn items: {count} of {slotCount}'
    inventory-items:
      one: 'Inventory items: {count} of {slotCount} slots'
      other: 'Inventory items: {count} of {slotCount} slots'
  save:
    saved:
      one: 'Kit {kit} saved: {count} item, {wornCount} worn and {inventoryCount} in the inventory'
      other: 'Kit {kit} saved: {count} items, {wornCount} worn and {inventoryCount} in the inventory'
    default-kit-written: 'It is written into {file} and is handed out from the next round on, a running round keeps the kit its fighters were given'
    other-kit-written: 'It is written into {file} and is handed out once it is used as the default kit'
    unreadable-items:
      one: '{count} item could not be read back and are no part of the kit, the log names them'
      other: '{count} items could not be read back and are no part of the kit, the log names them'
    empty-inventory-creation: 'Your inventory is empty, no kit was created'
    empty-inventory-replacement: 'Your inventory is empty, the kit was not changed'
  loader:
    unknown-reason: 'unknown reason'
    file-unreadable: 'The kits in {file} could not be read: {reason}. The file was kept as {keptFile}, there is no kit and every fighter starts a round with an empty kit until a kit is created in the kit menu of /tournament'
    file-set-aside: 'There is no {file}, the kits lie in {keptFile} because it could not be read at an earlier start. Repair {keptFile} and rename it to {file}, or delete it if its kits are to be discarded, then the next start takes the kit section of config.yml over'
    legacy-kit-unreadable: 'The kit section of config.yml holds no item that could be read, so no kit was taken over into {file}. There is no kit and every fighter starts a round with an empty kit until a kit is created in the kit menu of /tournament'
    legacy-kit-taken-over: 'The kit of config.yml was taken over into {file} as the kit {kit} and is the default kit. The kit section of config.yml is not read any more, the kits are managed in the kit menu of /tournament'
kit-choice-menu:
  title: 'Choose the kit for {match}'
  choice-over: 'The kit choice for match {match} is over'
  tile:
    info:
      title: 'Kit choice'
      match: 'Match {match}: {firstTeam} against {secondTeam}'
      default-kit: 'Default kit: {kit}'

# Language of the texts players and admins see: en or de. The texts live in the files of the lang folder next to this file.
language: en

# Rounds, the round time limit, sudden death, the start gate, the countdown before the fight, the time to come back after a lost connection, the team size and team colours.
match:
  # Ticks between the end of a round and the start of the next one (20 ticks are one second).
  round-reset-delay-ticks: 100
  # Time limit of a round in seconds, sudden death starts when it runs out. At least 1.
  round-timeout-seconds: 300
  # Seconds before the time limit in which the action bar counts down to sudden death.
  sudden-death-warning-seconds: 45
  # Damage each active fighter takes in the first second of sudden death.
  sudden-death-damage-per-second: 2.0
  # Damage added for every further second of sudden death.
  sudden-death-damage-increase-per-second: 1.0
  # When true, the rounds of the final have no time limit and no sudden death.
  disable-sudden-death-in-final: true
  # Seconds a placed start gate takes to open layer by layer at the start of a round. At least 1.
  start-gate-duration-seconds: 10
  # Seconds of the countdown right before the fight of every round, 0 to 10. The fighters are blind and cannot be hurt, the time limit of the round starts after it. 0 turns it off.
  countdown-seconds: 3
  # Seconds a fighter who loses the connection during a round has to come back before being eliminated, 0 to 600. 0 eliminates at once.
  reconnect-seconds: 60
  # Players per team, 1 to 8. A team added in the team menu of /tournament has at most this many players, the team menu changes it as well.
  team-size: 2
  # Scoreboard colours of the two teams of a match, as Minecraft colour names. Both must differ.
  team-colours:
    first-team: red
    second-team: aqua

# Matches between two teams without a tournament. The match menu of /tournament switches the mode on and off.
auto-match:
  # When true, two teams that each have a player online get a match while no tournament is in progress. The match menu writes this value.
  enabled: false
  # Seconds between the announcement of an auto match and its start, 3 to 120.
  start-delay-seconds: 10
  # Seconds of pause after an auto match and its cleaning before the next one is announced, 0 to 300.
  pause-seconds: 20

# Kits live in kits.yml since this version and are created, replaced and deleted in the kit menu of /tournament.
# A kit section of an older version, saved from the menu or written by hand, is taken over into kits.yml once and is not read afterwards.

# Cleaning and protection of the fight area.
arena:
  # Blocks written per tick while the arena is cleaned.
  clean-blocks-per-tick: 4096
  # Blocks read per tick while the baseline of the fight area is captured.
  baseline-blocks-per-tick: 16384
  # Layers the baseline covers and the cleaning restores, counted from the ground surface of the fight area down, 0 to 64.
  # 11 is the surface and the 10 blocks under it. Applies from the next calculation.
  baseline-depth-below-floor: 11
  # Particles that show a running cleaning.
  clean-particle:
    # false cleans without particles.
    enabled: true
    # Particle type. A colour carrying type such as DUST shows the red and green phases.
    type: DUST
    # Seconds for the red flood and the green clearing together, at most 120. 0 skips both phases.
    total-duration-seconds: 6.0
    # Particle columns drawn per tick, at most 64. 0 draws none.
    columns-per-tick: 24
  # Largest number of cells the flood fill may visit when it calculates the fight area.
  shape-maximum-cells: 50000
  # Blocks around the arena outline in which non-fighters take no environmental damage or hunger. 0 turns it off.
  safety-zone-radius: 64
  # Blocks added around the fight area to form the circle in which building, explosions, fire, pistons and player against player are restricted, 0 to 512.
  effect-margin: 96
  # When true, a player who joins is sent to the tribune once the arena is fully configured.
  teleport-on-join: true
  # Inventories of the players inside the area of effect.
  area-inventory:
    # When true, every player who enters the area of effect, admins included, hands in the whole inventory and gets it back on leaving. Items taken inside are removed on leaving. false keeps the inventory with the player.
    enabled: true
  # Calculated fight area, written by the plugin.
  shape: {}
  # Spawns of both teams and the tribune, written by the plugin.
  spawns: {}

# Particle display of border blocks for players who are not fighting.
border:
  # Ticks between two particle redraws.
  particle-period-ticks: 30
  # Distance in blocks around a player in which border blocks are shown.
  particle-view-radius: 12
  # Most border blocks shown to one player per redraw.
  particle-maximum-blocks-per-player: 24
  # Most connection lines between border columns shown to one player. 0 hides them.
  particle-maximum-lines-per-player: 48
  # Seconds the outline of a recognised wall is shown after a calculation.
  wall-preview-seconds: 4
  # Marker on each border block once the wall is confirmed.
  confirmed-particle:
    # false hides the marker, the outline shown after a calculation stays. The arena menu writes this value.
    enabled: true
    # Particle type.
    type: END_ROD
    # Height in blocks of the particle stream above the block. 0 draws a single particle.
    height: 0.25
    # RGB colour from 0 to 255, used only by colour carrying types such as DUST.
    colour:
      red: 255
      green: 255
      blue: 255
